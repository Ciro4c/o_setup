name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m unittest discover -s tests
      - run: >
          python -m PyInstaller --noconfirm --clean --onefile --uac-admin --name osetup
          --add-data "osetup\data;osetup\data" --collect-submodules osetup
          --hidden-import tkinter osetup_main.py
      - run: dist\osetup.exe list
      - uses: actions/upload-artifact@v4
        with:
          name: osetup-windows
          path: dist/osetup.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/osetup.exe
